<script>
  // Pick the language before first paint so the page never flashes the wrong one.
  (function () {
    var d = document.documentElement, l;
    d.classList.add('js');
    try { l = new URLSearchParams(location.search).get('lang') || localStorage.getItem('mai-lang'); } catch (e) {}
    if (l !== 'ja' && l !== 'en') {
      var langs = navigator.languages || [navigator.language || ''];
      l = 'en';
      for (var i = 0; i < langs.length; i++) if (/^ja/i.test(langs[i])) { l = 'ja'; break; }
    }
    d.lang = l;
    // If the scripts never arrive, show everything anyway.
    setTimeout(function () { d.classList.add('ready'); }, 2500);
  })();
</script>
